<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" fill="none">
  <rect width="960" height="300" rx="12" fill="#faf9f6" stroke="#e5e2dc" stroke-width="1.5"/>

  <!-- Left: Release Notes -->
  <rect x="36" y="36" width="424" height="228" rx="8" fill="#fcfbf8" stroke="#0f5c5c" stroke-width="2"/>
  <text x="64" y="74" font-family="Inter, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f5c5c">Release Notes</text>
  <text x="64" y="100" font-family="Inter, -apple-system, sans-serif" font-size="13" fill="#4b5563">Curated announcement per version</text>
  <line x1="64" y1="118" x2="432" y2="118" stroke="#e5e2dc" stroke-width="1"/>
  <text x="64" y="146" font-family="Inter, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#14171a">Readers: Customers, Product, IT Admins</text>
  <text x="64" y="174" font-family="Inter, -apple-system, sans-serif" font-size="13" fill="#4b5563">Focus: User benefits, highlights, upgrade steps</text>
  <text x="64" y="202" font-family="Inter, -apple-system, sans-serif" font-size="13" fill="#4b5563">Tone: Clear, outcome-oriented language</text>
  <text x="64" y="230" font-family="Inter, -apple-system, sans-serif" font-size="13" fill="#4b5563">Formats: Word (.docx), Google Docs, PDF, Email</text>

  <!-- Right: Changelog -->
  <rect x="500" y="36" width="424" height="228" rx="8" fill="#fcfbf8" stroke="#cfc9be" stroke-width="1.5"/>
  <text x="528" y="74" font-family="Inter, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#14171a">Changelog</text>
  <text x="528" y="100" font-family="Inter, -apple-system, sans-serif" font-size="13" fill="#4b5563">Complete chronological record of changes</text>
  <line x1="528" y1="118" x2="896" y2="118" stroke="#e5e2dc" stroke-width="1"/>
  <text x="528" y="146" font-family="Inter, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#14171a">Readers: Developers, Contributors, Integrators</text>
  <text x="528" y="174" font-family="Inter, -apple-system, sans-serif" font-size="13" fill="#4b5563">Focus: Every notable commit, PR, and patch</text>
  <text x="528" y="202" font-family="Inter, -apple-system, sans-serif" font-size="13" fill="#4b5563">Tone: Technical, concise, standardized</text>
  <text x="528" y="230" font-family="Inter, -apple-system, sans-serif" font-size="13" fill="#4b5563">Formats: CHANGELOG.md, RSS feed, Git tags</text>
</svg>
